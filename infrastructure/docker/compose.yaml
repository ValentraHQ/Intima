# INTIMA local development stack (Sprint 1, T1.4).
# Local only: every port binds to 127.0.0.1. No cloud resources, no paid services.
# Credentials come from infrastructure/docker/.env, generated by init-env.sh (git-ignored).
name: intima-local

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: intima
      POSTGRES_USER: intima
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run infrastructure/docker/init-env.sh}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intima -d intima']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?run infrastructure/docker/init-env.sh}',
        '--appendonly',
        'yes',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: intima
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run infrastructure/docker/init-env.sh}
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: ['rabbitmq-data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      # Local only: security plugin disabled, port bound to 127.0.0.1.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports: ['127.0.0.1:9200:9200']
    volumes: ['opensearch-data:/usr/share/opensearch/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  # S3-compatible object storage. SeaweedFS replaces MinIO (see infrastructure/docker/README.md).
  object-storage:
    image: chrislusf/seaweedfs:3.97
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-master.volumeSizeLimitMB=256',
      ]
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - 'object-storage-data:/data'
      - './.generated/s3.json:/etc/seaweedfs/s3.json:ro'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak:
    image: keycloak/keycloak:26.4
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run infrastructure/docker/init-env.sh}
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:8080:8080']
    volumes: ['keycloak-data:/opt/keycloak/data']
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  opensearch-data:
  object-storage-data:
  keycloak-data:
